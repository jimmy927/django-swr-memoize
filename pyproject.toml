[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-swr-memoize"
dynamic = ["version"]
description = "Stale-while-revalidate memoization for Django: API-compatible with django-memoize, but only the first call ever waits."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Morpheus Tribe" }]
dependencies = ["Django>=4.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Morpheus-Tribe/django-swr-memoize"
Issues = "https://github.com/Morpheus-Tribe/django-swr-memoize/issues"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.version]
path = "src/swr_memoize/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swr_memoize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
